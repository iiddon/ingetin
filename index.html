<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingetin</title>
<meta name="description" content="Kalender bersama teman: ingat acara, hal penting, dan persiapan.">
<meta name="theme-color" content="#2F5BEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ingetin">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --p:#2F5BEA;--p-d:#1E40AF;--p-l:#EAF0FF;--p-m:var(--p-m);--p-r:var(--p-r);--p-rgb:47,91,234;
  --bg:#F5F6FA;--card:#FFFFFF;--tx:#1B1F2A;--mu:#4B5563;--mu2:#3D4452;--bar:rgba(255,255,255,.96);--out:#D5DAE2;--outnum:#6B7280;--remind:#FFF7ED;--remind-b:#FED7AA;--mark:#FEF08A;
  color-scheme:light;
  --bd:#E4E7EE;--soft:#F1F3F7;--danger:#B91C1C;--ok:#166534;
  --r:14px;--sh:0 6px 16px rgba(var(--p-rgb),.24);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--p)}
h1,h2,h3{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-mode=dark]{--bg:#0F1115;--card:#181B22;--tx:#E8EAF0;--mu:#A3AAB8;--mu2:#C3C8D3;--bd:#2A303B;--soft:#232833;--bar:rgba(24,27,34,.96);--out:#2E3440;--outnum:#7D8594;--remind:#2A2116;--remind-b:#5A4220;--mark:#6B5B12;--danger:#F87171;--ok:#4ADE80;color-scheme:dark}
[data-mode=dark] .remind-h{color:#FDBA74}
[data-mode=dark] .btn.ghost,[data-mode=dark] a,[data-mode=dark] .btn.out,[data-mode=dark] .pchip.add>span,[data-mode=dark] .pinpad button.txt{color:var(--p-r)}
[data-mode=dark] .btn.out{border-color:var(--p-r)}
[data-mode=dark] .holrow{background:#3A1A1A;color:#FCA5A5}
[data-mode=dark] .holrow.cuti{background:#3A2616;color:#FDBA74}
[data-mode=dark] .sstip{background:#2A2116;border-color:#5A4220}[data-mode=dark] .sstip p{color:#FCD9B6}[data-mode=dark] .sstip-h{color:#FDBA74}
[data-mode=dark] .cell.red .num{color:#F87171}
[data-mode=dark] .backdrop{background:rgba(0,0,0,.6)}
[data-mode=dark] .chip,[data-mode=dark] .dblock,[data-mode=dark] .pill,[data-mode=dark] .av,[data-mode=dark] .pchip>span i{filter:saturate(.9) brightness(.92)}
:focus-visible{outline:3px solid var(--p-r);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;height:100dvh;padding-left:var(--sal);padding-right:var(--sar)}
.side{display:none}
main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(16px + var(--sat)) 16px calc(96px + var(--sab));min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding:6px 8px calc(6px + var(--sab))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;border:none;background:none;color:var(--mu);font-size:11px;font-weight:700;border-radius:12px;transition:background .15s,color .15s,transform .15s}
.tab.on{color:var(--p-d);background:var(--p-l)}
.tab:active{transform:scale(.95)}
.fab{position:fixed;right:calc(18px + var(--sar));bottom:calc(78px + var(--sab));z-index:21;width:58px;height:58px;border-radius:18px;border:none;background:var(--p);color:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
@media (min-width:1000px){
  .app{grid-template-columns:208px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;background:var(--card);border-right:1px solid var(--bd);padding:calc(24px + var(--sat)) 16px calc(20px + var(--sab));overflow-y:auto}
  .tabbar,.fab{display:none}
  main{padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab))}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.3px}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:10px;border:none;background:none;color:var(--mu2);font-weight:600;font-size:15px;text-align:left;transition:background .15s,transform .15s}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--p-l);color:var(--p-d);font-weight:700}
.nav:active{transform:scale(.97)}
.invite-card{margin-top:auto;background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--mu);line-height:1.4}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:700;font-size:15px;color:var(--tx);text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;box-shadow:var(--sh)}
.btn.pri:hover{filter:brightness(.94)}
.btn.out{border:1.5px solid var(--p);color:var(--p)}
.btn.danger{color:var(--danger);border-color:#FECACA}
.btn.ghost{border:none;background:none;color:var(--p);padding:0 6px;min-height:44px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.round{border-radius:50%;border:none;background:var(--soft)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2,.sec-h h3{font-size:17px;font-weight:800}
.sec-h small{font-size:12px;color:var(--mu);font-weight:600}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:26px;font-weight:800;letter-spacing:-.4px;flex-grow:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.muted{color:var(--mu)}
.empty{text-align:center;padding:24px 12px;color:var(--mu);font-size:14px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--tx);font-size:15px}
.stack{display:flex;flex-direction:column;gap:8px}

/* ---------- reminders banner ---------- */
.remind{background:var(--remind);border:1px solid var(--remind-b);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.remind-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:#9A3412}
.remind-i{display:flex;align-items:center;gap:10px;font-size:14px}
.remind-i span{flex:1}
.sync-note{display:flex;align-items:center;gap:10px;background:var(--p-l);color:var(--p-d);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.sync-note span{flex:1}

/* ---------- calendar ---------- */
.cal-layout{display:grid;gap:16px}
.cal-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.cal-h{display:flex;align-items:center;gap:8px}
.cal-h h1{flex:1;min-width:0;font-size:26px;font-weight:800;letter-spacing:-.4px}
.month-btn{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:none;background:none;padding:4px 8px 4px 0;border-radius:10px;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;transition:background .15s,transform .15s}
.month-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-btn svg{flex-shrink:0;color:var(--mu)}
.month-btn:active{transform:scale(.97)}
.cal-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
@media (max-width:999px){.cal-nav [data-act=search],.page-h [data-act=search]{display:none}}
.cal-nav .btn{min-height:44px}
.mp-year{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mp-year b{font-size:24px;font-weight:800}
.mp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mp-grid button{min-height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:700;font-size:15px;transition:transform .12s,background .15s}
.mp-grid button:active{transform:scale(.95)}
.mp-grid button.cur{background:var(--p);border-color:var(--p);color:#fff}
.mp-grid button.now{border:2px solid var(--p);color:var(--p-d)}
.mp-years{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.mp-years button{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);font-weight:700;font-size:14px}
.mp-years button.cur{background:var(--p-l);border-color:var(--p);color:var(--p-d)}
@media (max-width:999px){.aside .quick-top,.page-h .quick-top{display:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .pill{font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.dows,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dows span{font-size:12px;font-weight:700;color:var(--mu);text-align:center;text-transform:uppercase;letter-spacing:.6px}
.grid{grid-auto-rows:minmax(96px,auto)}
.cell{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;overflow:hidden;transition:transform .12s,box-shadow .15s,border-color .15s}
.cell:active{transform:scale(.97)}
.cell.out{background:transparent;border-style:dashed;border-color:var(--out)}
.cell.out .num{color:var(--outnum)}
.cell.sel{border:2px solid var(--p);box-shadow:0 0 0 3px var(--p-l)}
.num{height:24px;display:flex;align-items:center;padding-left:4px;font-size:13px;font-weight:700}
.cell.today .num{width:24px;padding:0;justify-content:center;border-radius:50%;background:var(--p);color:#fff;font-size:12px;font-weight:800}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:block;padding:3px 6px;border-radius:6px;font-size:11px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.more{font-size:11px;font-weight:700;color:var(--mu);padding-left:4px}
.aside{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1100px){
  main.fit{overflow:hidden;display:flex;flex-direction:column}
  main.fit>.remind,main.fit>.sync-note{flex-shrink:0}
  .cal-layout{grid-template-columns:minmax(0,1fr) 330px;flex:1;min-height:0}
  .cal-main{min-height:0}
  .cal-main .grid{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  .aside{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px 18px;overflow-y:auto;min-height:0}
}
.wk-layout{display:grid;gap:16px;align-items:start}
.ag-seg{margin-bottom:14px;max-width:420px}
.ag-month{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:599px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:72px;position:relative;transition:transform .12s,border-color .15s,background .15s}
.stat:active{transform:scale(.97)}
.stat::after{content:'›';position:absolute;right:12px;top:10px;font-size:20px;color:#9AA1AD;font-weight:700}
.stat.on{border-color:var(--p);background:var(--p-l);box-shadow:0 0 0 3px var(--p-m)}
.stat.on::after{color:var(--p)}
.flt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--p-l);color:var(--p-d);border-radius:12px;padding:4px 4px 4px 14px;margin-bottom:12px;font-size:14px}
.flt .mini{color:var(--p-d)}
.prep{gap:8px;margin-bottom:12px}
.prep-h{display:flex;align-items:center;gap:12px;border:none;background:none;padding:0;text-align:left;width:100%;color:inherit}
.prep-h svg{color:var(--mu);flex-shrink:0}
.stat b{font-size:24px;font-weight:800;color:var(--p-d)}
.stat span{font-size:12px;font-weight:600;color:var(--mu)}
.day-group.past .ev{opacity:.6}
.day-group.past h2 small{color:#6B7280}
@media (min-width:900px){.wk-layout{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:1099px){.aside .note-row{background:var(--card);border:1px solid var(--bd)}}
@media (max-width:599px){
  .cal-nav{gap:4px}
  .cal-nav .btn{min-height:40px;padding:0 10px;font-size:13px}
  .cal-nav .icon-btn{width:40px;height:40px}
  .grid{grid-auto-rows:minmax(58px,auto);gap:4px}
  .dows{gap:4px}
  .cell{padding:4px;border-radius:8px}
  .chip{font-size:0;padding:0;height:5px;border-radius:3px;-webkit-line-clamp:unset}
  .more{font-size:10px;padding-left:0}
  .cal-h h1{font-size:21px}
}

/* ---------- agenda rows ---------- */
.ev{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);text-align:left;width:100%;transition:transform .12s,background .15s}
.ev:hover{background:#FAFBFD}
.ev:active{transform:scale(.98)}
.dblock{width:46px;height:48px;flex-shrink:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dblock small{font-size:11px;font-weight:700}
.dblock b{font-size:17px;font-weight:800;line-height:1.1}
.ev-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-t b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ev-t span{font-size:12px;color:var(--mu);line-height:1.35}
.tag{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--mu2)}
.note-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.4}
.note-row .pill{font-size:11px;margin-top:1px}
.day-group{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.day-group h2{font-size:15px;font-weight:800}
.day-group h2 small{font-weight:600;color:var(--mu);margin-left:6px}

/* ---------- friends ---------- */
.fr-layout{display:grid;gap:16px}
@media (min-width:760px){.fr-layout{grid-template-columns:280px minmax(0,1fr)}}
.fr-list{display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--mu)}
.search input{border:none;background:transparent;outline:none;font-size:15px;width:100%;color:var(--tx)}
.fr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid transparent;background:var(--card);text-align:left;width:100%;transition:transform .12s,background .15s}
.fr:active{transform:scale(.98)}
.fr.on{background:var(--p-l);border-color:var(--p)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.fr-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.fr-t b{font-size:15px}
.fr-t span{font-size:12px;color:var(--mu)}
.fr-detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.fr-head{display:flex;align-items:center;gap:16px}
.fr-head h2{font-size:24px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.4}
.item span{flex:1;min-width:0;word-break:break-word}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:14px}
.tl-rail{display:flex;flex-direction:column;align-items:center;width:12px}
.tl-rail i{width:10px;height:10px;border-radius:50%;margin-top:5px}
.tl-rail u{flex:1;width:2px;text-decoration:none}
.tl-b{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;flex:1;min-width:0}
.tl-b small{font-size:12px;font-weight:700;color:var(--mu)}
.tl-b span{font-size:14px;line-height:1.4;word-break:break-word}
.mini{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mini:hover{background:var(--soft)}

/* ---------- sheet / dialog ---------- */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:50;animation:fade .2s ease}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:0 0 calc(16px + var(--sab));animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(600px,92vw);border-radius:22px;max-height:88dvh;animation:pop .22s cubic-bezier(.2,.8,.2,1)}}
.sh-band{height:8px}
.sh-body{padding:18px 20px 8px;display:flex;flex-direction:column;gap:14px}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-top h2{flex:1;font-size:21px;font-weight:800}
.sh-title{font-size:26px;font-weight:800;letter-spacing:-.3px;line-height:1.2;word-break:break-word}
.meta{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.45}
.meta svg{flex-shrink:0;margin-top:1px}
.sh-actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.sh-actions .btn{flex:1 1 auto}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .3s}
.chk{display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 6px 4px 12px;border-radius:12px;background:var(--bg)}
.chk input{width:22px;height:22px;accent-color:var(--p);flex-shrink:0}
.chk label{flex:1;font-size:15px;font-weight:600;cursor:pointer;padding:10px 0;word-break:break-word}
.chk.done label{text-decoration:line-through;color:var(--mu)}
.sw{display:flex;align-items:center;gap:12px;min-height:50px}
.sw span{flex:1;display:flex;flex-direction:column}
.sw b{font-size:15px}
.sw small{font-size:12px;color:var(--mu)}
.sw input{width:22px;height:22px;accent-color:var(--p);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--mu)}
.inp{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}

async function showNote(title, opts) {

  if (o.tag) o.tag = String(o.tag);

    try {
      const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((r) => setTimeout(() => r(null), 4000))]);
      if (reg && reg.showNotification) {

        let listed = null;

        return { ok: true, via: 'sw', listed };

    } catch (err) { lastErr = (err && (err.name + ': ' + err.message)) || String(err); }
  }
  try { new Notification(title, o); return { ok: true, via: 'page', listed: null }; }

}

function downloadIcs(inst) {
  const b = baseOf(inst) || inst; const e = isRec(b) ? { ...b, checklist: inst.checklist } : inst;
  const esc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const d = e.date.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  let start, startLine, endLine;
  if (e.time) {
    const [hh, mm] = e.time.split(':').map(Number); start = new Date(pd(e.date)); start.setHours(hh, mm || 0);
    const end = new Date(start.getTime() + 3600000);
    const f = (x) => ymd(x).replace(/-/g, '') + 'T' + pad(x.getHours()) + pad(x.getMinutes()) + '00';
    startLine = 'DTSTART:' + f(start); endLine = 'DTEND:' + f(end);
  } else {
    start = pd(e.date); startLine = 'DTSTART;VALUE=DATE:' + d; endLine = 'DTEND;VALUE=DATE:' + ymd(addDays(start, 1)).replace(/-/g, '');
  }
  const info = evInfo(e);
  const desc = [e.notes, ...(e.checklist || []).map((c) => (c.done ? '[x] ' : '[ ] ') + c.text), 'Dari Ingetin' + (info.who ? ' · ' + info.who : '')].filter(Boolean).join('\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ingetin//ID', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', 'UID:' + e.id + '@ingetin', 'DTSTAMP:' + stamp, startLine, endLine, 'SUMMARY:' + esc(e.title)];
  if (isRec(e)) {
    L.push('RRULE:FREQ=' + { yearly: 'YEARLY', monthly: 'MONTHLY', weekly: 'WEEKLY' }[e.repeat]);
    for (const [k, o] of Object.entries(e.occ || {})) if (o && o.skip) L.push((e.time ? 'EXDATE:' + k.replace(/-/g, '') + 'T' + e.time.replace(':', '') + '00' : 'EXDATE;VALUE=DATE:' + k.replace(/-/g, '')));
  }
  if (e.location) L.push('LOCATION:' + esc(e.location));
  L.push('DESCRIPTION:' + esc(desc));
  for (const k of (isMine(e) ? e.reminders || [] : ['h-1'])) {
    const at = remindAt(e, k); const mins = Math.round((at - start) / 60000);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(e.title), 'TRIGGER:' + (mins < 0 ? '-' : '') + 'PT' + Math.abs(mins) + 'M', 'END:VALARM');
  }

}

    const a = ymd(new Date(y, mo, 1)), z = ymd(new Date(y, mo + 1, 0)), today = todayS();
    const evs = eventsBetween(a, z), past = evs.filter((e) => e.date < today), next = evs.filter((e) => e.date >= today);
    const prepEvs = evs.filter((e) => (e.checklist || []).some((c) => !c.done));
    const open = prepEvs.reduce((n, e) => n + e.checklist.filter((c) => !c.done).length, 0);
    const pmap = new Map();
    for (const e of evs) { const i = evInfo(e); if (i.who === 'Kamu') continue; const k = i.person ? i.person.id : 'f:' + e.owner_id; const cur = pmap.get(k) || { name: i.who, color: i.color, id: i.person ? i.person.id : '', n: 0, next: null }; cur.n++; if (e.date >= today && (!cur.next || e.date < cur.next.date)) cur.next = e; pmap.set(k, cur); }
    const busiest = (() => { const c = {}; for (const e of evs) c[e.date] = (c[e.date] || 0) + 1; const top = Object.entries(c).sort((p, q) => q[1] - p[1])[0]; return top && top[1] > 1 ? top : null; })();
    const f = S.agFilter || 'all';
    const groupList = (arr, withHol) => {
      const days = [...new Set([...arr.map((e) => e.date), ...(withHol ? holBetween(a, z) : [])])].sort();
      return days.map((k) => { const d = pd(k), es = arr.filter((e) => e.date === k); return `<div class="day-group ${k < today ? 'past' : ''}"><h2>${k === today ? 'Hari ini' : HARI[d.getDay()] + ', ' + d.getDate()}<small>${k < today ? 'Sudah lewat' : rel(k)}</small></h2>${withHol ? holRow(k) : ''}${es.map((e) => evRow(e)).join('')}</div>`; }).join('');
    };
    const emptyBox = (title, text) => `<div class="card"><div class="empty">${ic('cal', 32, 1.6)}<b>${title}</b>${text}</div></div>`;
    let list = '';
    if (f === 'next') list = groupList(next) || emptyBox('Tidak ada acara yang akan datang', `Semua acara di ${BULAN[mo]} sudah lewat.`);
    else if (f === 'prep') {
      list = prepEvs.map((e) => { const i = evInfo(e), mine = isMine(e); return `<section class="card prep">
        <button type="button" class="prep-h" data-act="openEvent" data-id="${h(e.id)}"><span class="dblock" style="${cs(i.color)}"><small>${HARI3[pd(e.date).getDay()]}</small><b>${pd(e.date).getDate()}</b></span><span class="ev-t"><b>${h(e.title)}</b><span>${h(rel(e.date))} · ${e.checklist.filter((c) => !c.done).length} belum beres</span></span>${ic('right', 18, 2.2)}</button>
        ${e.checklist.map((c, k) => c.done ? '' : `<div class="chk"><input type="checkbox" id="pc-${h(e.id)}-${k}" data-chg="prepCheck" data-id="${h(e.id)}" data-i="${k}" ${mine ? '' : 'disabled'}><label for="pc-${h(e.id)}-${k}">${h(c.text)}</label></div>`).join('')}
      </section>`; }).join('') || emptyBox('Semua persiapan sudah beres 🎉', `Tidak ada checklist yang tertunda di ${BULAN[mo]}.`);
    } else if (f === 'people') {
      const arr = [...pmap.values()].sort((p, q) => q.n - p.n || p.name.localeCompare(q.name));
      list = arr.length ? `<div class="stack">${arr.map((p) => `<button type="button" class="fr" style="border-color:var(--bd)" ${p.id ? `data-act="openPerson" data-id="${h(p.id)}"` : 'disabled'}>${avatar({ name: p.name, color: p.color })}<span class="fr-t" style="flex:1"><b>${h(p.name)}</b><span>${p.n} acara${p.next ? ' · berikutnya ' + h(p.next.title) + ' (' + rel(p.next.date) + ')' : ''}</span></span>${p.id ? ic('right', 18, 2.2) : ''}</button>`).join('')}</div>`
        : emptyBox('Belum ada teman yang terlibat', `Acara di ${BULAN[mo]} belum dikaitkan dengan teman.`);
    } else list = groupList(evs, true) || emptyBox(`Belum ada acara di ${BULAN[mo]}`, 'Ketuk tombol <b style="font-size:inherit">+</b> untuk menambah.');
    const FL = { next: 'Akan datang', prep: 'Persiapan belum beres', people: 'Teman terlibat' };
    const stat = (k, n, label) => `<button type="button" class="stat ${f === k ? 'on' : ''}" data-act="agFilter" data-f="${k}" aria-pressed="${f === k}"><b>${n}</b><span>${label}</span></button>`;
    main = `<div class="ag-month"><button type="button" class="icon-btn" data-act="agMonth" data-n="-1" aria-label="Bulan sebelumnya">${ic('left', 18, 2.2)}</button>
        <button type="button" class="month-btn" data-act="agPick" style="font-size:20px;font-weight:800;flex:1;justify-content:center"><span>${BULAN[mo]} ${y}</span>${ic('down', 18, 2.4)}</button>
        <button type="button" class="icon-btn" data-act="agMonth" data-n="1" aria-label="Bulan berikutnya">${ic('right', 18, 2.2)}</button></div>
      <div class="stats">${stat('all', evs.length, 'Acara')}${stat('next', next.length, 'Akan datang')}${stat('prep', open, 'Persiapan belum beres')}${stat('people', pmap.size, 'Teman terlibat')}</div>
      ${f !== 'all' ? `<div class="flt"><span>Menampilkan: <b>${FL[f]}</b></span><button type="button" class="mini" data-act="agFilter" data-f="all" aria-label="Hapus filter, tampilkan semua acara">${ic('x', 16, 2.4)}</button></div>` : ''}
      ${busiest && f === 'all' ? `<div class="note-row" style="background:#FFF7ED;color:#9A3412;font-weight:600">${ic('zap', 16)}<span>Hari tersibuk: ${h(fmtLong(busiest[0]))} (${busiest[1]} acara)</span></div>` : ''}
      ${list}`;
  }
  const notes = S.data.notes.filter((n) => n.kind !== 'cerita');
  return `<div class="page-h"><h1>Agenda</h1><button type="button" class="icon-btn" data-act="search" aria-label="Cari">${ic('search', 18, 2.2)}</button><button type="button" class="btn pri quick-top" data-act="quick">${ic('plus', 18, 2.4)}Tambah cepat</button></div>
  ${seg}
  <div class="wk-layout">
    <section aria-label="${isMonth ? 'Agenda bulan ini' : 'Agenda 14 hari'}">${main}</section>
    <section class="card" aria-label="Hal yang harus diingat"><div class="sec-h"><h2>Ingat juga</h2><small>${notes.length} catatan</small></div>
      ${notesLocked() ? lockedCard() : notes.length ? notes.map(noteRow).join('') : '<p class="muted" style="margin:0;font-size:14px">Belum ada catatan.</p>'}
    </section>
  </div>`;
}
// put agenda first on wide screens
function vTeman() {
  const people = [...S.data.people].sort((a, b) => a.name.localeCompare(b.name));
  if (!people.length) {
    return `<div class="page-h"><h1>Teman</h1></div><div class="card"><div class="empty">${ic('people', 34, 1.6)}<b>Belum ada teman</b>Tambahkan teman untuk mencatat hal penting tentang mereka, atau undang mereka supaya kalender kalian terhubung.
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" class="btn pri" data-act="newPerson">+ Tambah teman</button><button type="button" class="btn out" data-act="invite">${ic('addUser', 18)}Undang</button></div></div></div>`;
  }
  const wide = window.matchMedia('(min-width:760px)').matches;
  if (!S.personId || !personById(S.personId)) S.personId = wide ? people[0].id : null;
  const showList = wide || !S.personId, showDetail = !!S.personId;
  return `<div class="page-h"><h1>Teman</h1><button type="button" class="btn out" data-act="invite">${ic('addUser', 18)}Undang</button><button type="button" class="btn pri" data-act="newPerson">+ Teman</button></div>
  <div class="fr-layout" style="align-items:start">
    ${showList ? `<div class="fr-list">
      <label for="cari" class="sr">Cari teman atau catatan</label>
      <div class="search">${ic('search', 18)}<input id="cari" type="search" placeholder="Cari teman atau catatan…" value="${h(S.q)}" autocomplete="off"></div>
      <div class="stack" id="frlist">${friendList()}</div>
    </div>` : ''}
    ${showDetail ? `<div class="fr-detail">${personDetail(personById(S.personId), wide)}</div>` : ''}
  </div>`;
}
function friendList() {
  const q = S.q.trim().toLowerCase();
  const list = [...S.data.people].sort((a, b) => a.name.localeCompare(b.name)).filter((p) => !q || p.name.toLowerCase().includes(q) || !notesLocked() && S.data.notes.some((n) => n.person_id === p.id && n.text.toLowerCase().includes(q)));
  if (!list.length) return `<p class="muted" style="font-size:14px;padding:8px">Tidak ada yang cocok dengan “${h(S.q)}”.</p>`;
  return list.map((p) => {
    const nn = S.data.notes.filter((n) => n.person_id === p.id).length, nx = personEvents(p)[0];
    const sub = [nx ? nx.title + ' · ' + rel(nx.date) : '', nn ? nn + ' catatan' : ''].filter(Boolean).join(' · ') || (p.linked_user_id ? 'Terhubung' : 'Belum ada catatan');
    return `<button type="button" class="fr ${p.id === S.personId ? 'on' : ''}" data-act="openPerson" data-id="${h(p.id)}">${avatar(p)}<span class="fr-t"><b>${h(p.name)}</b><span>${h(sub)}</span></span></button>`;
  }).join('');
}
function personDetail(p, wide) {
  const notes = S.data.notes.filter((n) => n.person_id === p.id);
  const ingat = notes.filter((n) => n.kind !== 'cerita').sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  const cerita = notes.filter((n) => n.kind === 'cerita').sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  const evs = personEvents(p);
  const c = pair(p.color);
  return `${wide ? '' : `<button type="button" class="btn ghost" style="align-self:flex-start" data-act="backList">${ic('left', 18, 2.2)}Semua teman</button>`}
  <div class="fr-head">${avatar(p, 72)}<div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0"><h2>${h(p.name)}</h2>
    ${p.linked_user_id ? `<span class="pill" style="${cs('green')};align-self:flex-start">${ic('check', 14, 2.4)}Terhubung · saling berbagi kalender</span>` : `<span class="pill" style="${cs('gray')};align-self:flex-start">${ic('lock', 13, 2.2)}Catatan pribadi</span>`}
    ${(() => { const nb = nextBday(p.id); if (!nb) return `<button type="button" class="btn ghost" style="align-self:flex-start;min-height:32px;padding:0" data-act="editPerson" data-id="${h(p.id)}">${ic('cake', 16)}&nbsp;Tambah ulang tahun</button>`; const d = pd(nb.date), n = diffDays(nb.date, todayS()), age = ageOn(nb); return `<span class="bday">${ic('cake', 16)}${d.getDate()} ${BULAN[d.getMonth()]}${age > 0 ? ' · ke-' + age : ''} · ${n === 0 ? 'hari ini!' : n === 1 ? 'besok' : n + ' hari lagi'}</span>`; })()}
  </div><button type="button" class="icon-btn" data-act="editPerson" data-id="${h(p.id)}" aria-label="Ubah ${h(p.name)}">${ic('edit', 18)}</button></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn pri" style="flex:1 1 200px" data-act="newNote" data-id="${h(p.id)}">+ Catat tentang ${h(p.name)}</button><button type="button" class="btn out" style="flex:0 1 auto" data-act="newEvent" data-person="${h(p.id)}">+ Event</button></div>
  ${notesLocked() ? `<section class="card">${lockedCard(ingat.length + ' catatan “Yang harus diingat” dan ' + cerita.length + ' “Pernah cerita” disembunyikan.')}</section>` : ''}
  ${notesLocked() ? '' : `<section class="card"><h3 style="font-size:16px;font-weight:800">Yang harus diingat</h3>
    ${ingat.length ? ingat.map((n) => `<div class="item"><span>${h(n.text)}</span><button type="button" class="mini" data-act="editNote" data-id="${h(n.id)}" aria-label="Ubah catatan">${ic('edit', 16)}</button><button type="button" class="mini" data-act="delNote" data-id="${h(n.id)}" aria-label="Hapus catatan">${ic('trash', 16)}</button></div>`).join('') : `<p class="muted" style="margin:0;font-size:14px">Belum ada. Misalnya alergi, makanan favorit, nama anggota keluarga.</p>`}
  </section>`}
  <section class="card"><h3 style="font-size:16px;font-weight:800">Event mendatang</h3>
    ${evs.length ? evs.slice(0, 6).map((e) => evRow(e)).join('') : `<p class="muted" style="margin:0;font-size:14px">Tidak ada event mendatang.</p>`}
  </section>
  ${notesLocked() ? '' : `<section class="card"><h3 style="font-size:16px;font-weight:800">Pernah cerita</h3>
    ${cerita.length ? `<div class="timeline">${cerita.map((n) => `<div class="tl"><div class="tl-rail"><i style="background:${c[1]}"></i><u style="background:${c[0]}"></u></div><div class="tl-b"><small>${n.created_at ? fmtShort(ymd(new Date(n.created_at))) : ''}</small><span>${h(n.text)}</span></div><button type="button" class="mini" data-act="editNote" data-id="${h(n.id)}" aria-label="Ubah cerita">${ic('edit', 16)}</button><button type="button" class="mini" data-act="delNote" data-id="${h(n.id)}" aria-label="Hapus cerita">${ic('trash', 16)}</button></div>`).join('')}</div>` : `<p class="muted" style="margin:0;font-size:14px">Catat cerita ${h(p.name)} supaya kamu bisa menanyakan kabarnya nanti.</p>`}
  </section>`}`;
}

      ${pinSet() ? `<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" data-act="pinChange">Ganti PIN</button>${notesLocked() ? '' : `<button type="button" class="btn" data-act="lockNow">${ic('lock', 16)}Kunci sekarang</button>`}</div>` : ''}
    </section>

      ${samsungTip(false)}

      ${perm === 'granted' ? `<div class="item"><span style="color:var(--ok);font-weight:700">${ic('check', 16, 2.4)} Notifikasi aktif</span><button type="button" class="btn ghost" data-act="testNotif">Kirim uji</button></div>`

    <section class="card"><div class="sec-h"><h2>Data</h2></div>
      <p>Simpan cadangan atau pindahkan data ke perangkat lain.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn" data-act="export">${ic('dl', 18)}Ekspor cadangan</button>
        <label class="btn" style="position:relative;overflow:hidden">${ic('share', 18)}Impor cadangan<input type="file" accept="application/json,.json" data-chg="importFile" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
      </div>
      ${hasCfg() && lsGet(CKEY, {}).supabaseUrl ? `<button type="button" class="btn ghost" style="align-self:flex-start" data-act="clearCfg">Putuskan sambungan Supabase di perangkat ini</button>` : ''}
    </section>
    <p style="text-align:center">Ingetin versi ${APP_VERSION} · ${S.mode === 'cloud' ? 'Mode online' : 'Mode perangkat ini'}</p>

const fmtDMY = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; };
function personPicker(id, sel, opt = {}) {
  const people = [...S.data.people].sort((a, b) => a.name.localeCompare(b.name));
  const chip = (val, label, color, extraCls = '') => `<label class="pchip ${extraCls}"><input type="radio" name="person" value="${h(val)}" data-chg="personPick" ${sel === val ? 'checked' : ''} ${opt.required ? 'required' : ''}><span>${color ? `<i style="${cs(color)}">${h((label || '?')[0].toUpperCase())}</i>` : ''}${h(label)}</span></label>`;
  let html = `<div class="pchips" role="radiogroup" aria-labelledby="${id}-l">`;
  if (!opt.required) html += chip('', 'Kamu', 'blue');
  for (const p of people) html += chip(p.id, p.name, p.color);
  if (opt.newName) html += chip('__new', opt.newName + ' · baru', FRIEND_COLORS[people.length % FRIEND_COLORS.length]);
  html += chip('__other', '+ Teman baru', null, 'add');
  html += `</div><div class="pnew field" ${sel === '__other' ? '' : 'hidden'}><label for="${id}-new">Nama teman baru</label><input class="inp" id="${id}-new" name="personNew" autocomplete="off" placeholder="mis. Nisya"></div>`;
  return `<div class="field"><span class="flabel" id="${id}-l">${opt.label || 'Teman'}</span>${html}</div>`;
}

function quickInput() {
  const ta = $('#qa-text'); if (!ta) return;
  const text = ta.value;

  S.sheet.text = text;
  if (r) {
    if (S.sheet.date && !r.date) { r.date = S.sheet.date; if (r.type === 'note' && !S.sheet.forceType && !/\b(alergi|suka|tidak suka|gak suka|nggak suka|favorit|ide kado)\b/i.test(text)) r.type = 'event'; }
    if (S.sheet.forceType) r.type = S.sheet.forceType;
    if (!r.personId && S.sheet.person && !r.newName) r.personId = S.sheet.person;
    const old = S.sheet.parsed; if (old) { r.location = old.location; r.notes = old.notes; }
  }
  S.sheet.parsed = r;
  const pos = ta.selectionStart, hadFocus = document.activeElement === ta;
  renderSheet();
  const t2 = $('#qa-text'); if (hadFocus) { t2.focus(); t2.setSelectionRange(pos, pos); }
}
async function ensurePerson(sel, newName, typed) {
  if (sel === '__other') newName = (typed || '').trim();
  else if (sel !== '__new') return sel || null;
  if (!newName) return null;
  const ex = S.data.people.find((p) => p.name.toLowerCase() === newName.toLowerCase());
  if (ex) return ex.id;
  const p = await save('people', { id: uid(), name: newName, color: FRIEND_COLORS[S.data.people.length % FRIEND_COLORS.length], linked_user_id: null });
  return p.id;
}

let PK = null;
function openPicker(kind, forId) {
  pushEntry();

  PK = { kind, forId };
  if (kind === 'date') { const d = v ? pd(v) : todayD(); PK.val = v; PK.month = new Date(d.getFullYear(), d.getMonth(), 1); }
  else { const [hh, mm] = v ? v.split(':') : ['', '']; PK.h = hh; PK.m = mm || ''; }
  renderPicker();
  const b = $('.picker'); b && b.focus({ preventScroll: true });
}
function closePicker(fromBack) { PK = null; $('#pick').innerHTML = ''; }
function setPicked(v) { const inp = $('#' + PK.forId); if (inp) { inp.value = v; fieldSet(PK.forId); } closePicker(); }
function renderPicker() {
  if (!PK) { $('#pick').innerHTML = ''; return; }
  let body = '';
  if (PK.kind === 'date') {
    const m = PK.month, y = m.getFullYear(), mo = m.getMonth(), first = new Date(y, mo, 1), off = (first.getDay() + 6) % 7;
    const rows = Math.ceil((off + new Date(y, mo + 1, 0).getDate()) / 7), start = addDays(first, -off), t = todayS();
    let cells = '';
    for (let i = 0; i < rows * 7; i++) {
      const d = addDays(start, i), k = ymd(d);
      cells += `<button type="button" class="${d.getMonth() !== mo ? 'out' : ''} ${k === t ? 'today' : ''} ${k === PK.val ? 'cur' : ''}" data-act="pkDay" data-d="${k}" aria-label="${h(fmtLong(k))}">${d.getDate()}</button>`;
    }

      <div class="pk-dows" aria-hidden="true">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((x) => `<span>${x}</span>`).join('')}</div>
      <div class="pk-grid">${cells}</div>
      <div class="pk-quick"><button type="button" class="btn" data-act="pkDay" data-d="${t}">Hari ini</button><button type="button" class="btn" data-act="pkDay" data-d="${ymd(addDays(todayD(), 1))}">Besok</button><button type="button" class="btn" data-act="pkClose">Batal</button></div>`;
  } else {
    const H = [], M = []; for (let i = 0; i < 24; i++) H.push(pad(i)); for (let i = 0; i < 60; i += 5) M.push(pad(i));
    if (PK.m && !M.includes(PK.m)) M.push(PK.m), M.sort();

  },
  async pinKey(d) {
    const s = S.sheet; if (!s || (s.buf || '').length >= 4) return;
    if (s.waitUntil && Date.now() < s.waitUntil) { s.msg = 'Tunggu ' + Math.ceil((s.waitUntil - Date.now()) / 1000) + ' detik lagi'; s.err = true; renderSheet(); return; }
    s.buf = (s.buf || '') + d.k; s.err = false; s.shake = false; s.msg = ''; renderSheet();
    if (s.buf.length < 4) return;

    const stored = lsGet('ingetin:pin', null);
    if (s.mode === 'set') { s.first = s.buf; s.mode = 'confirm'; s.buf = ''; renderSheet(); return; }
    if (s.mode === 'confirm') {

  if (ev.target.id === 'cari') { S.q = ev.target.value; const l = $('#frlist'); if (l) l.innerHTML = friendList(); }
  if (ev.target.id === 'pp-custom' || (ev.target.name === 'color' && ev.target.closest('[data-form=person]'))) {
    const f = ev.target.form; if (ev.target.id === 'pp-custom') { const r = $('#pp-custom-r'); if (r) r.checked = true; }
    const sel = f.querySelector('input[name=color]:checked'); const v = !sel || sel.value === 'custom' ? $('#pp-custom').value : sel.value;
    const pv = $('#pp-prev'); if (pv) pv.setAttribute('style', cs(v));
    if (ev.target.id === 'pp-custom') { const sw = $('#pp-custom-sw'); if (sw) sw.style.background = pair(v)[0]; }
  }
  if (ev.target.classList && ev.target.classList.contains('bad')) ev.target.classList.remove('bad');
  if (ev.target.id === 'qa-text') { clearTimeout(qaTimer); qaTimer = setTimeout(quickInput, 250); }
  if (['qa-title', 'qa-note', 'qa-loc', 'qa-notes'].includes(ev.target.id)) {
    const p = S.sheet && S.sheet.parsed; if (!p) return;
    p[{ 'qa-title': 'title', 'qa-note': 'noteText', 'qa-loc': 'location', 'qa-notes': 'notes' }[ev.target.id]] = ev.target.value;
  }
});
document.addEventListener('keydown', (ev) => {
  if (S.sheet && S.sheet.kind === 'pin' && /^[0-9]$/.test(ev.key)) { A.pinKey({ k: ev.key }); return; }
  if (S.sheet && S.sheet.kind === 'pin' && ev.key === 'Backspace') { A.pinDel(); return; }
  if (ev.key === 'Escape') { if (PK) closePicker(); else if ($('#dlg').innerHTML) { const n = $('#dlg [data-no]'); n && n.click(); } else if (S.sheet) closeSheet(); }
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey) && ev.target.id === 'qa-text') { const f = ev.target.form; f && f.requestSubmit(); }
});
let sx = null, sy = 0;
document.addEventListener('touchstart', (ev) => { const g = ev.target.closest && ev.target.closest('.grid'); if (g && ev.touches.length === 1) { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; } else sx = null; }, { passive: true });
document.addEventListener('touchend', (ev) => {
  if (sx === null) return; const t = ev.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { A.month({ n: dx < 0 ? 1 : -1 }); }
}, { passive: true });
addEventListener('scroll', () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); }, { passive: true });
let lastW = innerWidth;
addEventListener('resize', () => { if ((lastW < 760) !== (innerWidth < 760) || (lastW < 1100) !== (innerWidth < 1100)) render(); lastW = innerWidth; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (S.mode === 'cloud') loadData(); else render(); notifyDue(); } });
setTimeout(() => sendBrief(), 1500);
setInterval(() => sendBrief(), 60000);
let wasLocked = notesLocked();
setInterval(() => { const l = notesLocked(); if (l !== wasLocked) { wasLocked = l; if (!S.sheet) render(); } }, 15000);
let lastDay = todayS();
setInterval(() => {
  notifyDue();
  const busy = S.sheet || $('#dlg').innerHTML || (document.activeElement && document.activeElement.matches('input,textarea,select'));
  if (!busy && (dueReminders().length || todayS() !== lastDay)) { if (todayS() !== lastDay) { lastDay = todayS(); S.sel = lastDay; } render(); }
}, 60000);

/* ============ cloud bootstrap ============ */
async function acceptInvite(code) {
  if (S.mode !== 'cloud') { lsSet(IKEY, code); return; }
  const { data, error } = await S.sb.rpc('accept_invite', { code });
  localStorage.removeItem(IKEY);
  if (error) { toast(error.message.includes('sendiri') ? 'Itu kode undanganmu sendiri' : 'Kode undangan tidak ditemukan'); return; }
  toast('Terhubung dengan ' + data + '!'); await loadData(); if (S.sheet) renderSheet();
}
async function ensureProfile() {
  const u = S.session.user;
  let { data } = await S.sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
  if (!data) {
    const name = (u.user_metadata && u.user_metadata.name) || u.email.split('@')[0];
    const r = await S.sb.from('profiles').insert({ id: u.id, name }).select().single();
    if (r.error) throw r.error; data = r.data;
  }
  S.me = data;
}
async function migrateLocal() {
  const loc = Local.load(); const n = loc.people.length + loc.events.length + loc.notes.length;
  if (!n) return;
  if (!(await confirmBox(`Ada ${n} data yang tersimpan di perangkat ini. Pindahkan ke akunmu?`, 'Pindahkan'))) return;
  const me = myId();
  try {
    for (const t of ['people', 'events', 'notes']) for (const r of loc[t]) await Cloud.put(t, { ...r, owner_id: me });
    localStorage.removeItem(LKEY); toast('Data lokal sudah dipindahkan'); await loadData();
  } catch (err) { toast('Gagal memindahkan: ' + err.message); }
}
async function onSession(session) {
  const was = S.mode;
  S.session = session;
  if (session) {
    S.mode = 'cloud';
    try { await ensureProfile(); } catch (err) { toast('Gagal menyiapkan profil: ' + err.message + '. Sudah jalankan supabase-setup.sql?'); }
    await loadData();
    if (was !== 'cloud') await migrateLocal();
    const pending = lsGet(IKEY, null); if (pending) await acceptInvite(pending);
  } else {
    S.mode = 'local'; S.me = null; S.data = Local.load(); render();
  }
}
async function boot() {
  const qs = new URLSearchParams(location.search);
  const inv = qs.get('undang'), aksi = qs.get('aksi'), vw = qs.get('view');
  if (aksi || vw) history.replaceState(history.state, '', location.pathname);
  if (vw && VIEWS[vw]) S.view = vw;
  if (vw === 'bulan') { S.view = 'minggu'; S.agTab = 'bulan'; }
  if (inv) { lsSet(IKEY, inv); history.replaceState(null, '', location.pathname); }
  S.data = Local.load(); render();
  if (aksi === 'tambah') openSheet('quick', { text: '', parsed: null });
  syncHolidays();
  if (hasCfg()) {
    try {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const c = cfg(); S.sb = createClient(c.supabaseUrl, c.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      const { data } = await S.sb.auth.getSession();
      await onSession(data.session);
      S.sb.auth.onAuthStateChange((evt, session) => { if (evt === 'SIGNED_IN' && S.mode !== 'cloud') onSession(session); if (evt === 'SIGNED_OUT') onSession(null); if (evt === 'TOKEN_REFRESHED') S.session = session; });
    } catch (err) { toast('Tidak bisa tersambung ke server. Memakai data di perangkat ini.'); }
  }
  if (inv && S.mode !== 'cloud') { S.view = 'pengaturan'; S.authTab = 'daftar'; render(); toast('Kamu diundang! Daftar atau masuk untuk terhubung.'); }
  notifyDue();
}
/* ============ tombol kembali (Android) ============ */
// Chrome Android melewati entri riwayat yang dibuat tanpa ketukan pengguna,
// jadi entri selalu dibuat di dalam handler ketukan (click).
const NAV = [];
function navPush() { NAV.push({ view: S.view, personId: S.personId, agTab: S.agTab, scroll: $('#main') ? $('#main').scrollTop : 0 }); if (NAV.length > 40) NAV.shift(); pushEntry(); }
function navBack() {
  const p = NAV.pop(); if (!p) return false;
  S.view = p.view; S.personId = p.personId; if (p.agTab) S.agTab = p.agTab; render();
  const m = $('#main'); if (m) m.scrollTop = p.scroll || 0; return true;
}
const hDepth = () => (history.state && history.state.ingetin) || 0;
function pushEntry() { try { history.pushState({ ingetin: hDepth() + 1 }, ''); } catch {} }
document.addEventListener('click', () => { if (hDepth() === 0 && !leaving) pushEntry(); }, true);
let leaving = false, exitOpen = false;
addEventListener('popstate', async () => {
  if (leaving) return;
  if (PK) { closePicker(true); return; }
  if ($('#dlg').innerHTML) { const n = $('#dlg [data-no]'); n && n.click(); return; }
  if (S.sheet) { closeSheet(true); return; }
  if (navBack()) return;
  if (S.view === 'teman' && S.personId && !matchMedia('(min-width:760px)').matches) { S.personId = null; render(); return; }
  if (S.view !== 'kalender') { S.view = 'kalender'; render(); return; }
  if (exitOpen) return;
  exitOpen = true;
  const yes = await confirmBox('Apakah ingin keluar dari Ingetin?', 'Keluar', true);
  exitOpen = false;
  if (!yes) { if (hDepth() === 0) pushEntry(); return; }
  leaving = true;
  const d = hDepth();
  if (d > 0) history.go(-d);
  setTimeout(() => {
    try { window.close(); } catch {}
    setTimeout(() => { leaving = false; toast('Tekan tombol kembali sekali lagi untuk keluar'); }, 300);
  }, 250);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloaded && !S.sheet) { reloaded = true; location.reload(); } });
}
boot();
</script>
