<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingetin</title>
<meta name="description" content="Kalender bersama teman: ingat acara, hal penting, dan persiapan.">
<meta name="theme-color" content="#2F5BEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ingetin">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --p:#2F5BEA;--p-d:#1E40AF;--p-l:#EAF0FF;
  --bg:#F5F6FA;--card:#FFFFFF;--tx:#1B1F2A;--mu:#4B5563;--mu2:#3D4452;
  --bd:#E4E7EE;--soft:#F1F3F7;--danger:#B91C1C;--ok:#166534;
  --r:14px;--sh:0 6px 16px rgba(47,91,234,.22);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--p)}
h1,h2,h3{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #93B4FF;outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;height:100dvh;padding-left:var(--sal);padding-right:var(--sar)}
.side{display:none}
main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(16px + var(--sat)) 16px calc(96px + var(--sab));min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding:6px 8px calc(6px + var(--sab))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;border:none;background:none;color:var(--mu);font-size:11px;font-weight:700;border-radius:12px;transition:background .15s,color .15s,transform .15s}
.tab.on{color:var(--p-d);background:var(--p-l)}
.tab:active{transform:scale(.95)}
.fab{position:fixed;right:calc(18px + var(--sar));bottom:calc(78px + var(--sab));z-index:21;width:58px;height:58px;border-radius:18px;border:none;background:var(--p);color:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
@media (min-width:1000px){
  .app{grid-template-columns:208px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;background:var(--card);border-right:1px solid var(--bd);padding:calc(24px + var(--sat)) 16px calc(20px + var(--sab));overflow-y:auto}
  .tabbar,.fab{display:none}
  main{padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab))}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.3px}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:10px;border:none;background:none;color:var(--mu2);font-weight:600;font-size:15px;text-align:left;transition:background .15s,transform .15s}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--p-l);color:var(--p-d);font-weight:700}
.nav:active{transform:scale(.97)}
.invite-card{margin-top:auto;background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--mu);line-height:1.4}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:700;font-size:15px;color:var(--tx);text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;box-shadow:var(--sh)}
.btn.pri:hover{background:#2850D6}
.btn.out{border:1.5px solid var(--p);color:var(--p)}
.btn.danger{color:var(--danger);border-color:#FECACA}
.btn.ghost{border:none;background:none;color:var(--p);padding:0 6px;min-height:44px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.round{border-radius:50%;border:none;background:var(--soft)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2,.sec-h h3{font-size:17px;font-weight:800}
.sec-h small{font-size:12px;color:var(--mu);font-weight:600}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:26px;font-weight:800;letter-spacing:-.4px;flex-grow:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.muted{color:var(--mu)}
.empty{text-align:center;padding:24px 12px;color:var(--mu);font-size:14px;line-height:1.5;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--tx);font-size:15px}
.stack{display:flex;flex-direction:column;gap:8px}

/* ---------- reminders banner ---------- */
.remind{background:#FFF7ED;border:1px solid #FED7AA;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.remind-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:#9A3412}
.remind-i{display:flex;align-items:center;gap:10px;font-size:14px}
.remind-i span{flex:1}
.sync-note{display:flex;align-items:center;gap:10px;background:var(--p-l);color:var(--p-d);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.sync-note span{flex:1}

/* ---------- calendar ---------- */
.cal-layout{display:grid;gap:16px}
.cal-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.cal-h{display:flex;align-items:center;gap:8px}
.cal-h h1{flex:1;min-width:0;font-size:26px;font-weight:800;letter-spacing:-.4px}
.month-btn{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:none;background:none;padding:4px 8px 4px 0;border-radius:10px;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;transition:background .15s,transform .15s}
.month-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-btn svg{flex-shrink:0;color:var(--mu)}
.month-btn:active{transform:scale(.97)}
.cal-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
.cal-nav .btn{min-height:44px}
.mp-year{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mp-year b{font-size:24px;font-weight:800}
.mp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mp-grid button{min-height:52px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:700;font-size:15px;transition:transform .12s,background .15s}
.mp-grid button:active{transform:scale(.95)}
.mp-grid button.cur{background:var(--p);border-color:var(--p);color:#fff}
.mp-grid button.now{border:2px solid var(--p);color:var(--p-d)}
.mp-years{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.mp-years button{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);font-weight:700;font-size:14px}
.mp-years button.cur{background:var(--p-l);border-color:var(--p);color:var(--p-d)}
@media (max-width:999px){.aside .quick-top,.page-h .quick-top{display:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .pill{font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.dows,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dows span{font-size:12px;font-weight:700;color:var(--mu);text-align:center;text-transform:uppercase;letter-spacing:.6px}
.grid{grid-auto-rows:minmax(96px,auto)}
.cell{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;overflow:hidden;transition:transform .12s,box-shadow .15s,border-color .15s}
.cell:active{transform:scale(.97)}
.cell.out{background:transparent;border-style:dashed;border-color:#D5DAE2}
.cell.out .num{color:#6B7280}
.cell.sel{border:2px solid var(--p);box-shadow:0 0 0 3px var(--p-l)}
.num{height:24px;display:flex;align-items:center;padding-left:4px;font-size:13px;font-weight:700}
.cell.today .num{width:24px;padding:0;justify-content:center;border-radius:50%;background:var(--p);color:#fff;font-size:12px;font-weight:800}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:block;padding:3px 6px;border-radius:6px;font-size:11px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.more{font-size:11px;font-weight:700;color:var(--mu);padding-left:4px}
.aside{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1100px){
  main.fit{overflow:hidden;display:flex;flex-direction:column}
  main.fit>.remind,main.fit>.sync-note{flex-shrink:0}
  .cal-layout{grid-template-columns:minmax(0,1fr) 330px;flex:1;min-height:0}
  .cal-main{min-height:0}
  .cal-main .grid{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  .aside{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px 18px;overflow-y:auto;min-height:0}
}
.wk-layout{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.wk-layout{grid-template-columns:minmax(0,1fr) 320px}}
@media (max-width:1099px){.aside .note-row{background:var(--card);border:1px solid var(--bd)}}
@media (max-width:599px){
  .cal-nav{gap:4px}
  .cal-nav .btn{min-height:40px;padding:0 10px;font-size:13px}
  .cal-nav .icon-btn{width:40px;height:40px}
  .grid{grid-auto-rows:minmax(58px,auto);gap:4px}
  .dows{gap:4px}
  .cell{padding:4px;border-radius:8px}
  .chip{font-size:0;padding:0;height:5px;border-radius:3px;-webkit-line-clamp:unset}
  .more{font-size:10px;padding-left:0}
  .cal-h h1{font-size:21px}
}

/* ---------- agenda rows ---------- */
.ev{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);text-align:left;width:100%;transition:transform .12s,background .15s}
.ev:hover{background:#FAFBFD}
.ev:active{transform:scale(.98)}
.dblock{width:46px;height:48px;flex-shrink:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dblock small{font-size:11px;font-weight:700}
.dblock b{font-size:17px;font-weight:800;line-height:1.1}
.ev-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-t b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.ev-t span{font-size:12px;color:var(--mu);line-height:1.35}
.tag{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--mu2)}
.note-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.4}
.note-row .pill{font-size:11px;margin-top:1px}
.day-group{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.day-group h2{font-size:15px;font-weight:800}
.day-group h2 small{font-weight:600;color:var(--mu);margin-left:6px}

/* ---------- friends ---------- */
.fr-layout{display:grid;gap:16px}
@media (min-width:760px){.fr-layout{grid-template-columns:280px minmax(0,1fr)}}
.fr-list{display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--mu)}
.search input{border:none;background:transparent;outline:none;font-size:15px;width:100%;color:var(--tx)}
.fr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid transparent;background:var(--card);text-align:left;width:100%;transition:transform .12s,background .15s}
.fr:active{transform:scale(.98)}
.fr.on{background:var(--p-l);border-color:var(--p)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.fr-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.fr-t b{font-size:15px}
.fr-t span{font-size:12px;color:var(--mu)}
.fr-detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.fr-head{display:flex;align-items:center;gap:16px}
.fr-head h2{font-size:24px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.4}
.item span{flex:1;min-width:0;word-break:break-word}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:14px}
.tl-rail{display:flex;flex-direction:column;align-items:center;width:12px}
.tl-rail i{width:10px;height:10px;border-radius:50%;margin-top:5px}
.tl-rail u{flex:1;width:2px;text-decoration:none}
.tl-b{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;flex:1;min-width:0}
.tl-b small{font-size:12px;font-weight:700;color:var(--mu)}
.tl-b span{font-size:14px;line-height:1.4;word-break:break-word}
.mini{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mini:hover{background:var(--soft)}

/* ---------- sheet / dialog ---------- */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:50;animation:fade .2s ease}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:0 0 calc(16px + var(--sab));animation:up .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(600px,92vw);border-radius:22px;max-height:88dvh;animation:pop .22s cubic-bezier(.2,.8,.2,1)}}
.sh-band{height:8px}
.sh-body{padding:18px 20px 8px;display:flex;flex-direction:column;gap:14px}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-top h2{flex:1;font-size:21px;font-weight:800}
.sh-title{font-size:26px;font-weight:800;letter-spacing:-.3px;line-height:1.2;word-break:break-word}
.meta{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.45}
.meta svg{flex-shrink:0;margin-top:1px}
.sh-actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.sh-actions .btn{flex:1 1 auto}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .3s}
.chk{display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 6px 4px 12px;border-radius:12px;background:var(--bg)}
.chk input{width:22px;height:22px;accent-color:var(--p);flex-shrink:0}
.chk label{flex:1;font-size:15px;font-weight:600;cursor:pointer;padding:10px 0;word-break:break-word}
.chk.done label{text-decoration:line-through;color:var(--mu)}
.sw{display:flex;align-items:center;gap:12px;min-height:50px}
.sw span{flex:1;display:flex;flex-direction:column}
.sw b{font-size:15px}
.sw small{font-size:12px;color:var(--mu)}
.sw input{width:22px;height:22px;accent-color:var(--p);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--mu)}
.inp{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-l)}
textarea.inp{resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mu2);transition:background .15s,color .15s}
.seg input:checked+span{background:var(--card);color:var(--p-d);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg input:focus-visible+span{outline:3px solid #93B4FF}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches span{display:block;width:40px;height:40px;border-radius:50%;border:3px solid transparent;transition:transform .15s}
.swatches input:checked+span{border-color:var(--tx);transform:scale(1.08)}
.swatches input:focus-visible+span{outline:3px solid #93B4FF}
.custom-color{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:8px 8px 8px 14px;border:1px solid var(--bd);border-radius:12px}
.custom-color label{font-size:14px;font-weight:600;color:var(--mu2)}
.custom-color input{width:56px;height:40px;border:none;border-radius:10px;background:none;padding:0;cursor:pointer}
.pp-prev{margin-top:10px}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{position:relative}
.pchip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pchip>span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);font-weight:700;font-size:14px;color:var(--mu2);transition:background .15s,border-color .15s,transform .12s}
.pchip>span i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px}
.pchip.add>span{padding:0 14px;border-style:dashed;color:var(--p)}
.pchip input:checked+span{border-color:var(--p);background:var(--p-l);color:var(--p-d)}
.pchip input:focus-visible+span{outline:3px solid #93B4FF}
.pchip:active>span{transform:scale(.96)}
.pnew{margin-top:10px}
.pnew[hidden]{display:none}
.pickbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-weight:600;cursor:pointer}
.pickbtn.empty{color:#6B7280;font-weight:500}
.pickbtn svg{color:var(--mu);flex-shrink:0}
#pick .backdrop{z-index:64}
.picker{position:fixed;z-index:65;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,94vw);max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.22);animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.pk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pk-h b{font-size:18px;font-weight:800}
.pk-dows,.pk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

<script type="module">
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const todayD = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const todayS = () => ymd(new Date());
const diffDays = (a, b) => Math.round((pd(a) - pd(b)) / 86400000);
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const HARI3 = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const BUL3 = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const fmtLong = (s) => { const d = pd(s); return HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtShort = (s) => { const d = pd(s); return d.getDate() + ' ' + BUL3[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtTime = (t) => (t ? t.slice(0, 5).replace(':', '.') : '');
const rel = (s) => { const n = diffDays(s, todayS()); if (n === 0) return 'Hari ini'; if (n === 1) return 'Besok'; if (n === 2) return 'Lusa'; if (n > 0) return 'H-' + n; return n === -1 ? 'Kemarin' : (-n) + ' hari lalu'; };

const COLORS = {
  blue: ['#DBEAFE', '#1E40AF'], pink: ['#FCE7F3', '#9D174D'], green: ['#DCFCE7', '#166534'],
  purple: ['#EDE9FE', '#5B21B6'], orange: ['#FFEDD5', '#9A3412'], teal: ['#CCFBF1', '#115E59'],
  amber: ['#FEF3C7', '#92400E'], gray: ['#F1F3F7', '#3D4452']

// Pastel palette (stored as hex). Old named colors stay supported.
const PASTEL = ['#FFD6E0', '#FFDCD1', '#FFE5C7', '#FFF1B8', '#E2F5C8', '#CFF2DC', '#CDEFF0', '#D3E9FF', '#DCE0FF', '#E7DAFF', '#F6D8F2', '#EDE3D6'];
const FRIEND_COLORS = PASTEL;
const hex2hsl = (hx) => {
  let r = parseInt(hx.slice(1, 3), 16) / 255, g = parseInt(hx.slice(3, 5), 16) / 255, b = parseInt(hx.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let hh = 0, ss = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; ss = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60; }
  return [hh, ss * 100, l * 100];
};
const pairCache = {};
function pair(c) {
  if (COLORS[c]) return COLORS[c];
  if (typeof c !== 'string' || !/^#[0-9a-f]{6}$/i.test(c)) return COLORS.gray;
  if (pairCache[c]) return pairCache[c];
  const [hh, ss, l] = hex2hsl(c);
  const sat = Math.round(Math.min(Math.max(ss, 30), 85));
  const bg = l >= 80 ? c : `hsl(${Math.round(hh)} ${sat}% 88%)`;
  const fg = `hsl(${Math.round(hh)} ${Math.min(sat, 65)}% ${ss < 8 ? 30 : 27}%)`;
  return (pairCache[c] = [bg, fg]);
}
const cs = (c) => { const x = pair(c); return `background:${x[0]};color:${x[1]}`; };
const REM = [
  { k: 'h-7', label: 'H-7', days: 7 }, { k: 'h-3', label: 'H-3', days: 3 },
  { k: 'h-1', label: 'H-1', days: 1 }, { k: 'hari-h', label: 'Hari H', days: 0 }
];

const P = {
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  list: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  left: '<path d="M15 6l-6 6 6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', right: '<path d="M9 6l6 6-6 6"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  addUser: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M19 8v6M16 11h6"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  note: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  zap: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  chat: '<path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  share: '<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  dl: '<path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  cloud: '<path d="M7 18a5 5 0 0 1-.6-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>'
};
const ic = (n, s = 20, w = 2) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

/* ============ state ============ */
const LKEY = 'ingetin:data', CKEY = 'ingetin:cfg', DKEY = 'ingetin:dismissed', NKEY = 'ingetin:notified', IKEY = 'ingetin:invite';
const S = {
  view: 'kalender', month: (() => { const d = todayD(); d.setDate(1); return d; })(), sel: todayS(),
  personId: null, q: '', authTab: 'masuk',
  data: { people: [], events: [], notes: [], friends: [] },
  mode: 'local', sb: null, session: null, me: null, sheet: null, busy: false
};
const lsGet = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const cfg = () => { const base = window.INGETIN_CONFIG || {}; const loc = lsGet(CKEY, {}); return { supabaseUrl: loc.supabaseUrl || base.supabaseUrl || '', supabaseAnonKey: loc.supabaseAnonKey || base.supabaseAnonKey || '' }; };
const hasCfg = () => { const c = cfg(); return !!(c.supabaseUrl && c.supabaseAnonKey); };
const myId = () => (S.mode === 'cloud' ? S.session.user.id : 'local');
const isMine = (e) => e.owner_id === myId();

/* ============ data layer ============ */
const COLS = {
  people: ['id', 'owner_id', 'name', 'color', 'linked_user_id', 'created_at'],
  events: ['id', 'owner_id', 'person_id', 'title', 'date', 'time', 'location', 'notes', 'shared', 'checklist', 'reminders', 'created_at', 'updated_at'],
  notes: ['id', 'owner_id', 'person_id', 'text', 'kind', 'created_at']
};
const pick = (t, r) => { const o = {}; for (const c of COLS[t]) if (r[c] !== undefined) o[c] = r[c]; return o; };
const Local = {
  load() { const d = lsGet(LKEY, null) || { people: [], events: [], notes: [] }; return { people: d.people || [], events: d.events || [], notes: d.notes || [], friends: [] }; },
  persist() { const { people, events, notes } = S.data; lsSet(LKEY, { people, events, notes }); },
  async put() { this.persist(); }, async del() { this.persist(); }
};
const Cloud = {
  async load() {
    const sb = S.sb, me = S.session.user.id;
    const [p, e, n, f] = await Promise.all([
      sb.from('people').select('*').eq('owner_id', me), sb.from('events').select('*'),
      sb.from('notes').select('*').eq('owner_id', me), sb.from('friendships').select('friend_id').eq('user_id', me)
    ]);
    for (const r of [p, e, n, f]) if (r.error) throw r.error;
    let friends = [];
    const ids = f.data.map((x) => x.friend_id);
    if (ids.length) { const r = await sb.from('profiles').select('id,name').in('id', ids); if (r.error) throw r.error; friends = r.data; }
    return { people: p.data, events: e.data, notes: n.data, friends };
  },
  async put(t, row) { const { error } = await S.sb.from(t).upsert(pick(t, row)); if (error) throw error; },
  async del(t, id) { const { error } = await S.sb.from(t).delete().eq('id', id); if (error) throw error; }
};
const store = () => (S.mode === 'cloud' ? Cloud : Local);

async function save(t, row, quiet) {
  row.owner_id = row.owner_id || myId();
  row.created_at = row.created_at || new Date().toISOString();
  if (t === 'events') row.updated_at = new Date().toISOString();
  const arr = S.data[t]; const i = arr.findIndex((x) => x.id === row.id);
  if (i >= 0) arr[i] = row; else arr.push(row);
  render();
  try { await store().put(t, row); } catch (err) { toast('Gagal menyimpan: ' + (err.message || err)); }
  return row;
}
async function remove(t, id) {
  const arr = S.data[t]; const i = arr.findIndex((x) => x.id === id); if (i < 0) return null;
  const [old] = arr.splice(i, 1); render();
  try { await store().del(t, id); } catch (err) { toast('Gagal menghapus: ' + (err.message || err)); }
  return old;
}
async function loadData() {
  try {
    S.data = await store().load();
    if (S.mode === 'cloud') await linkFriends();
  } catch (err) { toast('Gagal memuat data: ' + (err.message || err)); }
  render();
}
async function linkFriends() {
  for (const f of S.data.friends) {
    if (!S.data.people.some((p) => p.linked_user_id === f.id)) {
      const row = { id: uid(), name: f.name, color: FRIEND_COLORS[S.data.people.length % FRIEND_COLORS.length], linked_user_id: f.id };
      row.owner_id = myId(); row.created_at = new Date().toISOString();
      S.data.people.push(row);
      try { await Cloud.put('people', row); } catch {}
    }
  }
}

/* ============ derived ============ */
const personById = (id) => S.data.people.find((p) => p.id === id);
const friendName = (uidv) => (S.data.friends.find((f) => f.id === uidv) || {}).name || 'Teman';
function evInfo(e) {
  if (isMine(e)) {
    const p = e.person_id && personById(e.person_id);
    return { color: p ? p.color : 'blue', who: p ? p.name : 'Kamu', person: p };
  }
  const p = S.data.people.find((x) => x.linked_user_id === e.owner_id);
  return { color: p ? p.color : 'gray', who: friendName(e.owner_id), person: p, from: friendName(e.owner_id) };
}
const sortEv = (a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99'));
const eventsOn = (d) => S.data.events.filter((e) => e.date === d).sort(sortEv);
const eventsBetween = (a, b) => S.data.events.filter((e) => e.date >= a && e.date <= b).sort(sortEv);
const checkProg = (e) => { const c = e.checklist || []; return c.length ? c.filter((x) => x.done).length + '/' + c.length + ' siap' : ''; };
const personEvents = (p) => S.data.events.filter((e) => e.date >= todayS() && (e.person_id === p.id || (p.linked_user_id && e.owner_id === p.linked_user_id))).sort(sortEv);

/* ============ reminders ============ */
function remindAt(e, k) {
  const r = REM.find((x) => x.k === k); if (!r) return null;
  const d = addDays(pd(e.date), -r.days);
  if (r.days === 0) {
    d.setHours(7, 0, 0, 0);
    if (e.time) { const [hh, mm] = e.time.split(':').map(Number); const start = new Date(pd(e.date)); start.setHours(hh, mm || 0); if (start - d < 3600000) d.setTime(start - 3600000); }
  } else d.setHours(19, 0, 0, 0);
  return d;
}
const remLabel = (e, k) => { const d = remindAt(e, k); return HARI[d.getDay()] + ', ' + d.getDate() + ' ' + BUL3[d.getMonth()] + ' · ' + pad(d.getHours()) + '.' + pad(d.getMinutes()); };
function dueReminders() {
  const now = new Date(), dis = lsGet(DKEY, []), out = [];
  for (const e of S.data.events) {
    const end = addDays(pd(e.date), 1); if (now > end) continue;
    const rs = isMine(e) ? (e.reminders || []) : ['h-1', 'hari-h'];
    for (const k of rs) {
      const at = remindAt(e, k); if (!at || now < at) continue;
      const key = e.id + '|' + k + '|' + e.date; if (dis.includes(key)) continue;
      out.push({ e, k, key });
    }
  }
  const seen = new Set();
  return out.sort((a, b) => sortEv(a.e, b.e)).filter((x) => (seen.has(x.e.id) ? false : seen.add(x.e.id)));
}
async function showNote(title, opts) {
  try {

function downloadIcs(e) {
  const esc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const d = e.date.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  let start, startLine, endLine;
  if (e.time) {
    const [hh, mm] = e.time.split(':').map(Number); start = new Date(pd(e.date)); start.setHours(hh, mm || 0);
    const end = new Date(start.getTime() + 3600000);
    const f = (x) => ymd(x).replace(/-/g, '') + 'T' + pad(x.getHours()) + pad(x.getMinutes()) + '00';
    startLine = 'DTSTART:' + f(start); endLine = 'DTEND:' + f(end);
  } else {
    start = pd(e.date); startLine = 'DTSTART;VALUE=DATE:' + d; endLine = 'DTEND;VALUE=DATE:' + ymd(addDays(start, 1)).replace(/-/g, '');
  }
  const info = evInfo(e);
  const desc = [e.notes, ...(e.checklist || []).map((c) => (c.done ? '[x] ' : '[ ] ') + c.text), 'Dari Ingetin' + (info.who ? ' · ' + info.who : '')].filter(Boolean).join('\n');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ingetin//ID', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', 'UID:' + e.id + '@ingetin', 'DTSTAMP:' + stamp, startLine, endLine, 'SUMMARY:' + esc(e.title)];
  if (e.location) L.push('LOCATION:' + esc(e.location));
  L.push('DESCRIPTION:' + esc(desc));
  for (const k of (isMine(e) ? e.reminders || [] : ['h-1'])) {
    const at = remindAt(e, k); const mins = Math.round((at - start) / 60000);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(e.title), 'TRIGGER:' + (mins < 0 ? '-' : '') + 'PT' + Math.abs(mins) + 'M', 'END:VALARM');
  }
  L.push('END:VEVENT', 'END:VCALENDAR');
  const blob = new Blob([L.join('\r\n')], { type: 'text/calendar' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (e.title || 'acara').replace(/[^\p{L}\p{N}]+/gu, '-').slice(0, 40) + '.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function friendList() {

  const list = [...S.data.people].sort((a, b) => a.name.localeCompare(b.name)).filter((p) => !q || p.name.toLowerCase().includes(q) || S.data.notes.some((n) => n.person_id === p.id && n.text.toLowerCase().includes(q)));
  if (!list.length) return `<p class="muted" style="font-size:14px;padding:8px">Tidak ada yang cocok dengan “${h(S.q)}”.</p>`;
  return list.map((p) => {
    const nn = S.data.notes.filter((n) => n.person_id === p.id).length, nx = personEvents(p)[0];
    const sub = [nx ? nx.title + ' · ' + rel(nx.date) : '', nn ? nn + ' catatan' : ''].filter(Boolean).join(' · ') || (p.linked_user_id ? 'Terhubung' : 'Belum ada catatan');

}

/* ============ sheets ============ */
const fmtDMY = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; };
function personPicker(id, sel, opt = {}) {
  const people = [...S.data.people].sort((a, b) => a.name.localeCompare(b.name));
  const chip = (val, label, color, extraCls = '') => `<label class="pchip ${extraCls}"><input type="radio" name="person" value="${h(val)}" data-chg="personPick" ${sel === val ? 'checked' : ''} ${opt.required ? 'required' : ''}><span>${color ? `<i style="${cs(color)}">${h((label || '?')[0].toUpperCase())}</i>` : ''}${h(label)}</span></label>`;
  let html = `<div class="pchips" role="radiogroup" aria-labelledby="${id}-l">`;
  if (!opt.required) html += chip('', 'Kamu', 'blue');
  for (const p of people) html += chip(p.id, p.name, p.color);
  if (opt.newName) html += chip('__new', opt.newName + ' · baru', FRIEND_COLORS[people.length % FRIEND_COLORS.length]);
  html += chip('__other', '+ Teman baru', null, 'add');
  html += `</div><div class="pnew field" ${sel === '__other' ? '' : 'hidden'}><label for="${id}-new">Nama teman baru</label><input class="inp" id="${id}-new" name="personNew" autocomplete="off" placeholder="mis. Nisya"></div>`;
  return `<div class="field"><span class="flabel" id="${id}-l">${opt.label || 'Teman'}</span>${html}</div>`;
}
function dateField(id, label, val, required) {
  return `<div class="field"><span class="flabel" id="${id}-l">${label}</span><input type="hidden" id="${id}" name="date" value="${h(val || '')}">
    <button type="button" class="inp pickbtn ${val ? '' : 'empty'}" data-act="pickDate" data-for="${id}" aria-labelledby="${id}-l ${id}-v"><span id="${id}-v">${val ? fmtDMY(val) : 'DD/MM/YYYY'}</span>${ic('cal', 18)}</button></div>`;
}
function timeField(id, label, val) {
  return `<div class="field"><span class="flabel" id="${id}-l">${label}</span><input type="hidden" id="${id}" name="time" value="${h(val || '')}">
    <button type="button" class="inp pickbtn ${val ? '' : 'empty'}" data-act="pickTime" data-for="${id}" aria-labelledby="${id}-l ${id}-v"><span id="${id}-v">${val ? fmtTime(val) : '--.--'}</span>${ic('clock', 18)}</button></div>`;
}
const personOptions = (sel, extra = '') => `<option value="">Kamu (tanpa teman)</option>${[...S.data.people].sort((a, b) => a.name.localeCompare(b.name)).map((p) => `<option value="${h(p.id)}" ${p.id === sel ? 'selected' : ''}>${h(p.name)}</option>`).join('')}${extra}`;
const remChecks = (list) => REM.map((r) => `<label class="sw"><span><b>${r.label}</b><small>${r.days === 0 ? 'Pukul 07.00 di hari acara' : r.days + ' hari sebelum, pukul 19.00'}</small></span><input type="checkbox" name="rem" value="${r.k}" ${list.includes(r.k) ? 'checked' : ''}></label>`).join('');
const shareBox = (on, label) => S.mode === 'cloud'

/* ============ quick add logic ============ */
function quickInput() {
  const ta = $('#qa-text'); if (!ta) return;
  const text = ta.value;
  const r = text.trim() ? parseQuick(text) : null;
  S.sheet.text = text;
  if (r) { if (S.sheet.forceType) r.type = S.sheet.forceType; if (!r.personId && S.sheet.person && !r.newName) r.personId = S.sheet.person; }
  S.sheet.parsed = r;
  const pos = ta.selectionStart, hadFocus = document.activeElement === ta;
  renderSheet();
  const t2 = $('#qa-text'); if (hadFocus) { t2.focus(); t2.setSelectionRange(pos, pos); }
}
async function ensurePerson(sel, newName, typed) {
  if (sel === '__other') newName = (typed || '').trim();
  else if (sel !== '__new') return sel || null;
  if (!newName) return null;
  const ex = S.data.people.find((p) => p.name.toLowerCase() === newName.toLowerCase());
  if (ex) return ex.id;
  const p = await save('people', { id: uid(), name: newName, color: FRIEND_COLORS[S.data.people.length % FRIEND_COLORS.length], linked_user_id: null });
  return p.id;
}

/* ============ date / time picker ============ */
let PK = null;
function openPicker(kind, forId) {
  pushEntry();
  const v = ($('#' + forId) || {}).value || '';
  PK = { kind, forId };
  if (kind === 'date') { const d = v ? pd(v) : todayD(); PK.val = v; PK.month = new Date(d.getFullYear(), d.getMonth(), 1); }
  else { const [hh, mm] = v ? v.split(':') : ['', '']; PK.h = hh; PK.m = mm || ''; }
  renderPicker();
  const b = $('.picker'); b && b.focus({ preventScroll: true });
}
function closePicker(fromBack) { PK = null; $('#pick').innerHTML = ''; }
function setPicked(v) { const inp = $('#' + PK.forId); if (inp) { inp.value = v; fieldSet(PK.forId); } closePicker(); }
function renderPicker() {
  if (!PK) { $('#pick').innerHTML = ''; return; }
  let body = '';
  if (PK.kind === 'date') {
    const m = PK.month, y = m.getFullYear(), mo = m.getMonth(), first = new Date(y, mo, 1), off = (first.getDay() + 6) % 7;
    const rows = Math.ceil((off + new Date(y, mo + 1, 0).getDate()) / 7), start = addDays(first, -off), t = todayS();
    let cells = '';
    for (let i = 0; i < rows * 7; i++) {
      const d = addDays(start, i), k = ymd(d);
      cells += `<button type="button" class="${d.getMonth() !== mo ? 'out' : ''} ${k === t ? 'today' : ''} ${k === PK.val ? 'cur' : ''}" data-act="pkDay" data-d="${k}" aria-label="${h(fmtLong(k))}">${d.getDate()}</button>`;
    }
    body = `<div class="pk-h"><button type="button" class="icon-btn" data-act="pkMonth" data-n="-1" aria-label="Bulan sebelumnya">${ic('left', 18, 2.2)}</button><b>${BULAN[mo]} ${y}</b><button type="button" class="icon-btn" data-act="pkMonth" data-n="1" aria-label="Bulan berikutnya">${ic('right', 18, 2.2)}</button></div>
      <div class="pk-dows" aria-hidden="true">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((x) => `<span>${x}</span>`).join('')}</div>
      <div class="pk-grid">${cells}</div>
      <div class="pk-quick"><button type="button" class="btn" data-act="pkDay" data-d="${t}">Hari ini</button><button type="button" class="btn" data-act="pkDay" data-d="${ymd(addDays(todayD(), 1))}">Besok</button><button type="button" class="btn" data-act="pkClose">Batal</button></div>`;
  } else {
    const H = [], M = []; for (let i = 0; i < 24; i++) H.push(pad(i)); for (let i = 0; i < 60; i += 5) M.push(pad(i));
    if (PK.m && !M.includes(PK.m)) M.push(PK.m), M.sort();
    body = `<div class="pk-h" style="justify-content:center"><b>Pilih jam</b></div>
      <div class="pk-big" aria-live="polite">${PK.h || '--'}.${PK.h ? (PK.m || '00') : '--'}</div>
      <div class="pk-lbl">Jam</div><div class="pk-tgrid" role="group" aria-label="Jam">${H.map((x) => `<button type="button" class="${x === PK.h ? 'cur' : ''}" data-act="pkHour" data-v="${x}" aria-pressed="${x === PK.h}">${x}</button>`).join('')}</div>
      <div class="pk-lbl">Menit</div><div class="pk-tgrid" role="group" aria-label="Menit">${M.map((x) => `<button type="button" class="${x === (PK.m || (PK.h ? '00' : '')) ? 'cur' : ''}" data-act="pkMin" data-v="${x}" aria-pressed="${x === PK.m}">${x}</button>`).join('')}</div>
      <div class="pk-quick"><button type="button" class="btn" data-act="pkNoTime">Tanpa jam</button><button type="button" class="btn" data-act="pkClose">Batal</button><button type="button" class="btn pri" data-act="pkTimeOk" ${PK.h ? '' : 'disabled'}>Pilih</button></div>`;
  }
  $('#pick').innerHTML = `<div class="backdrop" data-act="pkClose"></div><div class="picker" role="dialog" aria-modal="true" aria-label="${PK.kind === 'date' ? 'Pilih tanggal' : 'Pilih jam'}" tabindex="-1">${body}</div>`;
}

/* ============ actions ============ */
const A = {
  pickDate(d) { openPicker('date', d.for); },
  pickTime(d) { openPicker('time', d.for); },
  pkClose() { closePicker(); },
  pkMonth(d) { PK.month = new Date(PK.month.getFullYear(), PK.month.getMonth() + +d.n, 1); renderPicker(); },
  pkDay(d) { setPicked(d.d); },
  pkHour(d) { PK.h = d.v; if (!PK.m) PK.m = '00'; renderPicker(); },
  pkMin(d) { PK.m = d.v; if (!PK.h) PK.h = '09'; renderPicker(); },
  pkNoTime() { setPicked(''); },
  pkTimeOk() { if (PK.h) setPicked(PK.h + ':' + (PK.m || '00')); },
  go(d) { if (S.view === 'kalender' && d.v !== 'kalender') pushEntry(); S.view = d.v; closeSheet(); render(); $('#main') && ($('#main').scrollTop = 0); },
  month(d) { const m = new Date(S.month); m.setMonth(m.getMonth() + +d.n); S.month = m; render(); },
  today() { const t = todayD(); t.setDate(1); S.month = t; S.sel = todayS(); if (S.sheet) closeSheet(); render(); },
  pickMonth() { openSheet('monthPick', { year: S.month.getFullYear() }); const c = $('.mp-years .cur'); c && c.scrollIntoView({ inline: 'center', block: 'nearest' }); },
  mpYear(d) { S.sheet.year += +d.n; renderSheet(); },
  mpSetYear(d) { S.sheet.year = +d.y; renderSheet(); const c = $('.mp-years .cur'); c && c.scrollIntoView({ inline: 'center', block: 'nearest' }); },
  mpGo(d) { S.month = new Date(S.sheet.year, +d.m, 1); closeSheet(); render(); },

async function acceptInvite(code) {

  localStorage.removeItem(IKEY);
  if (error) { toast(error.message.includes('sendiri') ? 'Itu kode undanganmu sendiri' : 'Kode undangan tidak ditemukan'); return; }
  toast('Terhubung dengan ' + data + '!'); await loadData(); if (S.sheet) renderSheet();
}
async function ensureProfile() {
  const u = S.session.user;
  let { data } = await S.sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
  if (!data) {

  if (S.sheet) { closeSheet(true); return; }
  if (S.view === 'teman' && S.personId && !matchMedia('(min-width:760px)').matches) { S.personId = null; render(); return; }
  if (S.view !== 'kalender') { S.view = 'kalender'; render(); return; }
  if (exitOpen) return;
  exitOpen = true;
  const yes = await confirmBox('Apakah ingin keluar dari Ingetin?', 'Keluar', true);
  exitOpen = false;
  if (!yes) { if (hDepth() === 0) pushEntry(); return; }
  leaving = true;
  const d = hDepth();
  if (d > 0) history.go(-d);
  setTimeout(() => {
    try { window.close(); } catch {}
    setTimeout(() => { leaving = false; toast('Tekan tombol kembali sekali lagi untuk keluar'); }, 300);
  }, 250);
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
</html>
